<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="BeatDrop: DJ with your hands">
  <defs>
    <radialGradient id="glowA" cx="0" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#4fd9d2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4fd9d2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#c47be8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c47be8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2a2a30"/>
      <stop offset="0.35" stop-color="#121214"/>
      <stop offset="0.9" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#2a2a30"/>
    </radialGradient>
    <clipPath id="panel"><rect width="1200" height="320" rx="22"/></clipPath>
    <style>
      .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.1s ease-in-out infinite alternate; }
      .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 3.6s linear infinite; }
      @keyframes eq { from { transform: scaleY(0.35); } to { transform: scaleY(1); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .bar, .spin { animation: none; } }
      .title { font: 800 92px "Rubik", "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1px; }
      .sub { font: 600 26px "Rubik", "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.5px; }
      .tag { font: 700 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 3px; }
    </style>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1200" height="320" fill="#16161a"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>

    <!-- Records half off each edge, like the decks screen -->
    <g class="spin">
      <circle cx="0" cy="175" r="150" fill="url(#vinyl)"/>
      <circle cx="0" cy="175" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
      <circle cx="0" cy="175" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
      <circle cx="0" cy="175" r="48" fill="#f3efe4"/>
      <rect x="30" y="171" width="16" height="8" rx="2" fill="#4fd9d2"/>
    </g>
    <circle cx="0" cy="175" r="150" fill="none" stroke="#4fd9d2" stroke-width="3" stroke-opacity="0.9"/>
    <g class="spin">
      <circle cx="1200" cy="175" r="150" fill="url(#vinyl)"/>
      <circle cx="1200" cy="175" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
      <circle cx="1200" cy="175" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
      <circle cx="1200" cy="175" r="48" fill="#f3efe4"/>
      <rect x="1154" y="171" width="16" height="8" rx="2" fill="#c47be8"/>
    </g>
    <circle cx="1200" cy="175" r="150" fill="none" stroke="#c47be8" stroke-width="3" stroke-opacity="0.9"/>

    <!-- Title -->
    <text class="tag" x="600" y="70" text-anchor="middle" fill="#f27a2c">DUBHACKS 2026</text>
    <text class="title" x="600" y="160" text-anchor="middle" fill="#f4f1ea">BeatDrop</text>
    <text class="sub" x="600" y="200" text-anchor="middle" fill="#f4f1ea" fill-opacity="0.72">DJ with your hands. Two screens, one webcam, no controller.</text>

    <!-- Equalizer in the stem colours: vocals, drums, bass, instrumental -->
    <g transform="translate(408 228)">
      <rect class="bar" x="0"   y="0" width="14" height="58" rx="4" fill="#4a6bf0" style="animation-delay:-0.1s"/>
      <rect class="bar" x="24"  y="0" width="14" height="58" rx="4" fill="#4fd9d2" style="animation-delay:-0.7s"/>
      <rect class="bar" x="48"  y="0" width="14" height="58" rx="4" fill="#c47be8" style="animation-delay:-0.3s"/>
      <rect class="bar" x="72"  y="0" width="14" height="58" rx="4" fill="#8b3fc0" style="animation-delay:-0.9s"/>
      <rect class="bar" x="96"  y="0" width="14" height="58" rx="4" fill="#4a6bf0" style="animation-delay:-0.5s"/>
      <rect class="bar" x="120" y="0" width="14" height="58" rx="4" fill="#4fd9d2" style="animation-delay:-0.2s"/>
      <rect class="bar" x="144" y="0" width="14" height="58" rx="4" fill="#f27a2c" style="animation-delay:-0.8s"/>
      <rect class="bar" x="168" y="0" width="14" height="58" rx="4" fill="#c47be8" style="animation-delay:-0.4s"/>
      <rect class="bar" x="192" y="0" width="14" height="58" rx="4" fill="#8b3fc0" style="animation-delay:-1.0s"/>
      <rect class="bar" x="216" y="0" width="14" height="58" rx="4" fill="#4a6bf0" style="animation-delay:-0.6s"/>
      <rect class="bar" x="240" y="0" width="14" height="58" rx="4" fill="#4fd9d2" style="animation-delay:-0.15s"/>
      <rect class="bar" x="264" y="0" width="14" height="58" rx="4" fill="#c47be8" style="animation-delay:-0.75s"/>
      <rect class="bar" x="288" y="0" width="14" height="58" rx="4" fill="#f27a2c" style="animation-delay:-0.35s"/>
      <rect class="bar" x="312" y="0" width="14" height="58" rx="4" fill="#8b3fc0" style="animation-delay:-0.95s"/>
      <rect class="bar" x="336" y="0" width="14" height="58" rx="4" fill="#4a6bf0" style="animation-delay:-0.55s"/>
      <rect class="bar" x="360" y="0" width="14" height="58" rx="4" fill="#4fd9d2" style="animation-delay:-0.25s"/>
    </g>
  </g>
</svg>
