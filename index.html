<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beatdrop</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, sans-serif; }
      body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
      #stage { position: relative; width: 100vw; height: 56.25vw; }
      #stage video, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* Mirror the feed so it behaves like a mirror. The overlay canvas is NOT
         flipped: perception already outputs mirrored coordinates. */
      #stage video { transform: scaleX(-1); object-fit: cover; }
      #hud { position: absolute; top: 8px; left: 8px; font: 13px/1.4 ui-monospace, monospace;
             background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="hud">Starting camera…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
